# Elastic Beanstalk Docker Compose bundle — copied to docker-compose.yml
# at the artifact root by buildspec.yml. Runs BOTH apps on one instance:
#   port 80   → R2RA FastAPI        (CloudFront d2si4nfgz87czj /api/*)
#   port 8080 → role2-builder API   (CloudFront api.role2builder.org)
#
# EB generates .env in the app root from the environment properties set
# in the EB console. The r2ra service consumes it wholesale; the
# role2builder service gets ONLY its own variables (interpolated from
# the same .env) so it never sees R2RA's DATABASE_URL or SECRET_KEY.
#
# The role2builder/ build context is the latest bundle published by the
# role2-builder pipeline to s3://r2ra-artifacts-885232248320/role2-builder/latest.zip
# (fetched during CodeBuild — see buildspec.yml).
services:
  r2ra:
    build: .
    ports:
      - "80:8000"
    env_file: .env
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  role2builder:
    build: ./role2builder
    ports:
      - "8080:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
