version: 0.2

# Environment variables set in CodeBuild project:
#   FRONTEND_BUCKET     — S3 bucket name for the React build
#   CF_DISTRIBUTION_ID  — CloudFront distribution ID
#   AWS_DEFAULT_REGION  — injected automatically by CodeBuild

phases:
  install:
    runtime-versions:
      nodejs: "20"
    commands:
      - cd frontend && npm install && cd ..

  build:
    commands:
      # --- Frontend ---
      - cd frontend && npm run build && cd ..

      # Upload immutable assets with long cache; index.html must not be cached
      - >
        aws s3 sync frontend/dist s3://$FRONTEND_BUCKET --delete
        --cache-control "max-age=31536000,immutable"
        --exclude "index.html"
      - >
        aws s3 cp frontend/dist/index.html s3://$FRONTEND_BUCKET/index.html
        --cache-control "no-cache, no-store, must-revalidate"

      # Bust the CDN — invalidate everything so SW and assets are fresh
      - >
        aws cloudfront create-invalidation
        --distribution-id $CF_DISTRIBUTION_ID
        --paths "/*"

      # Remove files that should not go into the EB artifact
      - find backend -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
      - find backend -name "*.pyc" -delete 2>/dev/null || true
      - rm -f backend/*.db backend/.env

      # --- role2-builder co-tenant ---
      # Pull the latest bundle its own pipeline published (Dockerfile,
      # backend/, requirements.txt) and stage it as a second compose
      # service. See deploy/docker-compose.eb.yml.
      - aws s3 cp s3://r2ra-artifacts-885232248320/role2-builder/latest.zip rb.zip
      - mkdir -p role2builder && unzip -o -q rb.zip -d role2builder/
      - cp deploy/docker-compose.eb.yml docker-compose.yml

artifacts:
  # CodePipeline wraps these into a zip and hands it directly to EB.
  # docker-compose.yml at the root switches EB to Compose mode (no EB
  # nginx; compose maps 80→r2ra, 8080→role2builder). Do NOT create a
  # nested deploy.zip.
  files:
    - docker-compose.yml
    - Dockerfile
    - start.sh
    - backend/**/*
    - content/**/*
    - role2builder/**/*
    - .ebextensions/**/*
